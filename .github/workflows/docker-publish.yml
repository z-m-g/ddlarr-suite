name: Build and Push Docker Images

on:
  push:
    branches:
      - release
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: ddl-torznab
            context: ./indexer
            dockerfile: ./indexer/Dockerfile
          - name: dlprotect-resolver
            context: ./botasaurus-service
            dockerfile: ./botasaurus-service/Dockerfile
          - name: ddl-qbittorrent
            context: ./qbittorrent
            dockerfile: ./qbittorrent/Dockerfile
          - name: darkiworld
            context: ./darkiworld
            dockerfile: ./darkiworld/Dockerfile
        platform:
          - runner: ubuntu-latest
            pair: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            pair: linux/arm64
            slug: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.pair }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image.name }}-${{ matrix.platform.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - ddl-torznab
          - dlprotect-resolver
          - ddl-qbittorrent
          - darkiworld
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if manifest needs update
        id: check
        working-directory: /tmp/digests
        run: |
          new_digests=$(ls -1 | sed 's/^/sha256:/' | sort | tr '\n' ' ' | xargs)
          echo "New digests: $new_digests"

          image="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest"
          if raw=$(docker buildx imagetools inspect "$image" --raw 2>/dev/null); then
            current_digests=$(echo "$raw" | jq -r '.manifests[].digest' | sort | tr '\n' ' ' | xargs)
            echo "Current :latest digests: $current_digests"
            if [ "$new_digests" = "$current_digests" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Image ${{ matrix.image }} unchanged, skipping manifest push"
              exit 0
            fi
          else
            echo "No existing :latest for ${{ matrix.image }}"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        if: steps.check.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Create manifest list and push
        if: steps.check.outputs.changed == 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)